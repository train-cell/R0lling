name: R0lling CI (Cloud macOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-verify:
    name: Python examples / source presence (not Swift validation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run independent Python model examples
        run: python verification/verify_all_subsystems.py

      - name: Inspect source/config presence (no runtime compliance)
        run: python verification/verify_theme_apple_meta_compliance.py

      - name: Guard assistant chat context wiring
        run: python verification/verify_assistant_chat_context.py

      - name: Guard transcript cue honesty and AppState wiring
        run: python verification/verify_transcript_keyword_tagging.py

      - name: Guard source/UI invariants unavailable to Linux type-checking
        run: python verification/verify_ui_source_contracts.py

  portable-harnesses:
    # These isolated harnesses compile selected production files with Linux
    # shims (for example ImageIO, Vision, and CoreLocation stand-ins). They were
    # validated on Linux Swift 6.1, so they run in the official Swift 6.1 Linux
    # image instead of blocking the authoritative Apple build below.
    name: Portable production-source harnesses (Linux; not Apple validation)
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python for runner source preprocessing
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3

      - name: Swift Version
        run: swift --version

      - name: Run focused production-source regression suites
        run: |
          bash verification/run_ai_request_xctests.sh
          bash verification/run_ai_router_cancellation_tests.sh
          bash verification/run_voice_command_tests.sh
          bash verification/run_journal_storage_xctests.sh
          bash verification/run_highlight_reel_commit_tests.sh
          bash verification/run_sleep_episode_tests.sh
          bash verification/run_speech_completion_registry_tests.sh
          bash verification/run_meal_nutrition_tests.sh
          bash verification/run_fitness_activity_tests.sh
          bash verification/run_knowledge_graph_tests.sh
          bash verification/run_agent_memory_transaction_tests.sh
          bash verification/run_obsidian_watcher_tests.sh
          bash verification/run_hyperlapse_tests.sh
          bash verification/run_storage_guard_tests.sh
          bash verification/run_backup_restore_xctests.sh
          bash verification/run_obsidian_bridge_xctests.sh
          bash verification/run_streak_manager_tests.sh
          bash verification/run_vision_analysis_pipeline_tests.sh
          bash verification/run_transcript_keyword_tagger_tests.sh
          bash verification/run_clip_watermark_contract_probe.sh
          bash verification/run_glasses_connection_cancellation_probe.sh
          bash verification/run_on_device_vision_probe.sh
          bash verification/run_portable_source_probes.sh

  build-and-test:
    name: Swift build + test (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    needs: []  # parallel με python-verify και portable-harnesses

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.4+ (Swift 6.3 required by Meta DAT 1.0.1)
        run: |
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.5.app /Applications/Xcode_26.4.1.app /Applications/Xcode_26.4.app; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              xcodebuild -version
              exit 0
            fi
          done
          echo "::error::Xcode 26.4 or newer is required by swift-tools-version 6.3 and Meta DAT 1.0.1."
          ls -d /Applications/Xcode*.app || true
          exit 1

      - name: Swift Version
        run: swift --version

      - name: Build R0lling (macOS target)
        run: |
          set -o pipefail
          if ! swift build -v --build-tests 2>&1 | tee swift-build.log; then
            python3 verification/extract_swift_build_errors.py swift-build.log
            exit 1
          fi

      - name: Run Tests (macOS target)
        run: |
          set -o pipefail
          # xctest block-buffers a pipe (16 KB), which once hid the hanging test. The
          # pseudo-terminal keeps output line-buffered; after 15 minutes the watchdog
          # names the running test, samples xctest, and stops so the logs still upload.
          if ! python3 verification/run_with_pty_watchdog.py 900 -- swift test 2>&1 | tee swift-test.log; then
            python3 verification/extract_swift_build_errors.py swift-test.log
            exit 1
          fi

      - name: Upload swift logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-build-and-test-logs
          path: |
            swift-build.log
            swift-test.log
          if-no-files-found: warn
          retention-days: 14

  package-ios-app:
    name: Build & Package iOS App (.ipa)
    runs-on: macos-26
    timeout-minutes: 30
    # Do not publish an IPA artifact if the Swift checks, the portable
    # harnesses, or the independent source/config checks failed.
    needs: [build-and-test, portable-harnesses, python-verify]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.4+ (Swift 6.3 required by Meta DAT 1.0.1)
        run: |
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.5.app /Applications/Xcode_26.4.1.app /Applications/Xcode_26.4.app; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              xcodebuild -version
              exit 0
            fi
          done
          echo "::error::Xcode 26.4 or newer is required by swift-tools-version 6.3 and Meta DAT 1.0.1."
          ls -d /Applications/Xcode*.app || true
          exit 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: Apps/R0llingApp
        run: xcodegen generate

      - name: Build iOS App (Generic iOS Device)
        working-directory: Apps/R0llingApp
        run: |
          xcodebuild clean build \
            -project R0llingApp.xcodeproj \
            -scheme R0llingApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="${PWD}/build"

      - name: Build iOS App (iOS Simulator)
        working-directory: Apps/R0llingApp
        run: |
          xcodebuild build \
            -project R0llingApp.xcodeproj \
            -scheme R0llingApp \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="${PWD}/build-sim"
          ls -la build-sim/Debug-iphonesimulator/R0llingApp.app

      - name: Package .ipa for Sideloadly
        working-directory: Apps/R0llingApp
        run: |
          mkdir -p build/Release-iphoneos/Payload
          cp -R "build/Release-iphoneos/R0llingApp.app" build/Release-iphoneos/Payload/
          cd build/Release-iphoneos
          zip -r R0lling.ipa Payload
          ls -la R0lling.ipa

      - name: Upload iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: R0lling-iOS-IPA
          path: Apps/R0llingApp/build/Release-iphoneos/R0lling.ipa
          if-no-files-found: error
          retention-days: 30
