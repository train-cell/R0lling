name: R0lling CI (Cloud macOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  python-verify:
    name: Python verification (Windows-parity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage 3 defects
        run: python verification/diagnose_stage3_defects.py

      - name: Stage 4 fixes
        run: python verification/diagnose_stage4_fixes.py

      - name: Stage 5 finalize
        run: python verification/diagnose_stage5_finalize.py

      - name: Verify all subsystems
        run: python verification/verify_all_subsystems.py

  build-and-test:
    name: Swift build + test (macOS)
    runs-on: macos-14
    timeout-minutes: 20
    needs: []  # parallel με python-verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 15.4 / 16
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Swift Version
        run: swift --version

      - name: Build R0lling (macOS target)
        run: swift build -v

      - name: Run Tests (macOS target)
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee swift-test.log

      - name: Upload swift test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-log
          path: swift-test.log
          if-no-files-found: warn
          retention-days: 14
