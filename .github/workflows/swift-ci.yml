name: R0lling CI (Cloud macOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  python-verify:
    name: Python verification (Windows-parity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage 3 defects
        run: python verification/diagnose_stage3_defects.py

      - name: Stage 4 fixes
        run: python verification/diagnose_stage4_fixes.py

      - name: Stage 5 finalize
        run: python verification/diagnose_stage5_finalize.py

      - name: Verify all subsystems
        run: python verification/verify_all_subsystems.py

      - name: Verify theme, Apple & Meta compliance
        run: python verification/verify_theme_apple_meta_compliance.py

  build-and-test:
    name: Swift build + test (macOS)
    runs-on: macos-14
    timeout-minutes: 20
    needs: []  # parallel με python-verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16 / 15
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Swift Version
        run: swift --version

      - name: Build R0lling (macOS target)
        run: |
          set -o pipefail
          if ! swift build -v --build-tests 2>&1 | tee swift-build.log; then
            python3 verification/extract_swift_build_errors.py swift-build.log
            exit 1
          fi

      - name: Run Tests (macOS target)
        run: |
          set -o pipefail
          if ! swift test 2>&1 | tee swift-test.log; then
            python3 verification/extract_swift_build_errors.py swift-test.log
            exit 1
          fi

      - name: Upload swift logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-build-and-test-logs
          path: |
            swift-build.log
            swift-test.log
          if-no-files-found: warn
          retention-days: 14

  package-ios-app:
    name: Build & Package iOS App (.ipa)
    runs-on: macos-14
    timeout-minutes: 25
    needs: [build-and-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16 / 15
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: Apps/R0llingApp
        run: xcodegen generate

      - name: Build iOS App (Generic iOS Device)
        working-directory: Apps/R0llingApp
        run: |
          xcodebuild clean build \
            -project R0llingApp.xcodeproj \
            -scheme R0llingApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="${PWD}/build"

      - name: Build iOS App (iOS Simulator)
        working-directory: Apps/R0llingApp
        run: |
          xcodebuild build \
            -project R0llingApp.xcodeproj \
            -scheme R0llingApp \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="${PWD}/build-sim"
          ls -la build-sim/Debug-iphonesimulator/R0llingApp.app

      - name: Package .ipa for Sideloadly
        working-directory: Apps/R0llingApp
        run: |
          mkdir -p build/Release-iphoneos/Payload
          cp -R "build/Release-iphoneos/R0llingApp.app" build/Release-iphoneos/Payload/
          cd build/Release-iphoneos
          zip -r R0lling.ipa Payload
          ls -la R0lling.ipa

      - name: Upload iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: R0lling-iOS-IPA
          path: Apps/R0llingApp/build/Release-iphoneos/R0lling.ipa
          if-no-files-found: error
          retention-days: 30
